<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Rock Paper Scissors</h1>
        
        <div class="buttons">
            <button class="choice" data-choice="rock">🪨 Rock</button>
            <button class="choice" data-choice="paper">📄 Paper</button>
            <button class="choice" data-choice="scissors">✂️ Scissors</button>
        </div>
        
        <p id="result"></p>
        <p>Player: <span id="playerScore">0</span> | Computer: <span id="computerScore">0</span></p>
        <button id="resetBtn">Reset Scores</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
