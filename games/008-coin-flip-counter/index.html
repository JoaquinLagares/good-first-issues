<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Coin Flip Game</h1>
        
        <div class="coin-display">
            <div id="coin">?</div>
        </div>
        
        <div class="button-group">
            <button id="headsBtn">Heads</button>
            <button id="tailsBtn">Tails</button>
        </div>
        
        <p id="result"></p>
        
        <div class="stats">
            <p>Heads: <span id="headsCount">0</span></p>
            <p>Tails: <span id="tailsCount">0</span></p>
            <p>Flips: <span id="totalFlips">0</span></p>
        </div>
        
        <button id="resetBtn">Reset Stats</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
