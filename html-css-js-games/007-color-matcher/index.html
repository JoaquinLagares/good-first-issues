<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Matcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Color Matcher</h1>
        <p>Match the target color!</p>
        
        <div class="target">
            <div id="targetColor"></div>
            <p id="targetLabel"></p>
        </div>
        
        <div class="choices">
            <div class="color-box" id="color1"></div>
            <div class="color-box" id="color2"></div>
            <div class="color-box" id="color3"></div>
        </div>
        
        <p id="message"></p>
        <p>Score: <span id="score">0</span></p>
        
        <button id="nextBtn">Next Color</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
