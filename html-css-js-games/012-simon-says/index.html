<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Simon Says</h1>
        <p>Remember the sequence!</p>
        
        <div class="game-board">
            <div class="button" id="btn1" data-color="1"></div>
            <div class="button" id="btn2" data-color="2"></div>
            <div class="button" id="btn3" data-color="3"></div>
            <div class="button" id="btn4" data-color="4"></div>
        </div>
        
        <p>Level: <span id="level">1</span></p>
        <p id="message"></p>
        <button id="startBtn">Start Game</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
