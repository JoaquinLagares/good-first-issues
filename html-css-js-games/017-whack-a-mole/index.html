<!DOCTYPE html>
<html lang="en">
<head>

    <title>Whack-a-Mole</title>

            <div class="hole" onclick="whackMole(this)">🕳️</div>
            <div class="hole" onclick="whackMole(this)">🕳️</div>
            <div class="hole" onclick="whackMole(this)">🕳️</div>
            <div class="hole" onclick="whackMole(this)">🕳️</div>
            <div class="hole" onclick="whackMole(this)">🕳️</div>
            <div class="hole" onclick="whackMole(this)">🕳️</div>
            <div class="hole" onclick="whackMole(this)">🕳️</div>
        </div>
        
        <button id="startBtn">Start Game</button>
        <p id="message"></p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
